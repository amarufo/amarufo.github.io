# ============================================================
#  Configuración del sitio — amaru_fo
#  Centro de recursos para el formulador de inversión pública
# ============================================================

# --- Identidad del sitio ---
title: "Amaru Fernandez"
tagline: "Centro de Recursos del Formulador de Inversión Pública"
handle: "amaru_fo"
description: >-
  Normativa, metodologías, aplicativos y herramientas de ciencia de datos
  para la formulación y evaluación de proyectos de inversión pública
  (Invierte.pe) en el Perú. Por Wilbert Amaru Fernández Olmedo.
author:
  name: "Wilbert Amaru Fernandez Olmedo"
  short: "Amaru Fernandez"
  email: "amaruf9523@gmail.com"

# --- URL (GitHub Pages) ---
url: "https://amarufo.github.io"
baseurl: ""
lang: es

# --- Imagen por defecto para Open Graph / redes ---
image: "/images/icono2.webp"
logo: "/images/icono2.webp"
redirect_site: "https://inviertepe.com"

# --- Redes y contacto ---
social:
  whatsapp: "51934657378"
  whatsapp_display: "+51 934 657 378"
  youtube: "https://www.youtube.com/@amaru_fo_inversiones"
  linkedin: "https://www.linkedin.com/in/amarufo/"
  github: "https://github.com/amarufo"
  email: "amaruf9523@gmail.com"
formspree: "https://formspree.io/f/REEMPLAZAR"

# --- Construcción ---
markdown: kramdown
highlighter: rouge
permalink: pretty
timezone: America/Lima

# --- Plugins (compatibles con GitHub Pages) ---
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed

# --- Colecciones (proyectos dinámicos vía Markdown) ---
collections:
  projects:
    output: true
    permalink: /proyectos/:name/

# --- Valores por defecto del Front Matter ---
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
      type: projects
    values:
      layout: project
  - scope:
      path: ""
    values:
      layout: page

# --- Paginación / orden ---
show_excerpts: true

# --- Exclusiones del build ---
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - README.md
  - .gitignore
