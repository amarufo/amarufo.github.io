              url: "https://drive.google.com/drive/u/0/folders/1Fpw7wSsZlT_LS_KqiCtcBrxFqTzq8u3u"
              desc: "Dentro de 'Estudios de Preinversión' encontrarás "              
            - label: "Lineamientos para Seguridad Ciudadana"
              type: web
              url: "https://www.mef.gob.pe/contenidos/inv_publica/docs/novedades/2014/Anexo_Lineamientos-PIP-seguridad-ciudadana-VFf%20(2)-(3).pdf"
              desc: "Aprobado por Resolución Directoral Nº 001-2014-EF/63.01"   
      - label: "Metodologías sectoriales oficiales"
        type: web
        url: "https://www.mef.gob.pe/es/metodologias"
        desc: "Acceso a las metodologías sectoriales oficiales para la formulación y evaluación de proyectos de inversión pública"
- label: "Aplicativos del Estado"
  type: folder
  color: "#0891b2"
  open: false
  desc: "Plataformas oficiales del ciclo de inversión pública"
  children:
      - label: "🔐 Banco de Inversiones"
        type: app
        url: "https://ofi5.mef.gob.pe/invierte#!/login"
        desc: "Planificación, registro y seguimiento de inversiones públicas"
      - label: "⛓️‍💥 SSI - Sistema de Seguimiento de Inversiones"
        type: app
        url: "https://ofi5.mef.gob.pe/ssi/"
        desc: "Plataforma de seguimiento y monitoreo de inversiones públicas"
      - label: "⛓️‍💥 Consulta de Inversiones por CUI"
        type: app
        url: "https://ofi5.mef.gob.pe/invierte/consultapublica/consultainversiones"
        desc: "Consulta de Inversiones a través de Código Único de Inversión (CUI)"
      - label: "⛓️‍💥 Consulta Avanzada de Inversiones"
        type: app
        url: "https://ofi5.mef.gob.pe/inviertePub/ConsultaPublica/ConsultaAvanzada"
        desc: "Consulta avanzada de inversiones públicas por tipología, sector, ubicación, entre otros filtros"
      - label: "⛓️‍💥 Consulta de Ideas de Inversiones"
        type: app
        url: "https://ofi5.mef.gob.pe/inviertePub/ConsultaPublica/ConsultaAvanzadaIdeas"
        desc: "Consulta de ideas de inversiones públicas por tipología, sector, ubicación, entre otros filtros"
      - label: "⛓️‍💥 Consulta de Carteras PMI de Inversiones"
        type: app
        url: "https://ofi5.mef.gob.pe/invierte/pmi/consultapmi"
        desc: "Consulta de carteras PMI de inversiones públicas"
      - label: "Otras aplicaciones oficiales del Invierte.pe"
        type: app
        url: "https://www.mef.gob.pe/es/aplicativos-invierte-pe"

