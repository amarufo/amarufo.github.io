      type: app
      url: "https://ofi5.mef.gob.pe/inviertews/SeguimientoPublico/"
    - label: "Sistema de Seguimiento de Inversiones (SSI)"
      type: app
      url: "https://ssi.mef.gob.pe/"
    - label: "GEOInvierte — Visor georreferenciado"
      type: app
      url: "https://geoinvierte.mef.gob.pe/"
    - label: "Consulta Amigable del Gasto Público (SIAF)"
      type: app
      url: "https://apps5.mineco.gob.pe/transparencia/Navegador/default.aspx"

