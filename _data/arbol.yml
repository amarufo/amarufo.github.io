      url: "https://www.mef.gob.pe/es/metodologias-generales"
    - label: "Portal de Metodologías Generales del MEF"
      type: web
      url: "https://www.mef.gob.pe/es/metodologias-generales"

- label: "Fichas Técnicas y Metodologías Específicas"
  type: folder
  color: "#ca8a04"
  desc: "Fichas técnicas estándar y simplificadas por sector"
  children:
    - label: "Fichas técnicas estándar y simplificadas"
      type: form
      url: "https://www.mef.gob.pe/es/fichas-tecnicas"
