# ============================================================
#  Árbol de recursos OFICIALES de Invierte.pe (MEF / Estado)
#  Solo normativa, metodologías, aplicativos del Estado, fichas
#  y anexos oficiales. NO incluye aplicaciones propias.
#  type:  folder | law | pdf | app | web | video | form | data
# otros types:  book | course | tutorial | tool | dataset | report | article
#  color: color identificador de la categoría (acento del nodo)
# ============================================================

- label: "Normatividad"
