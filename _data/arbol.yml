  children:
      - label: "Normatividad general del Invierte.pe"
        type: folder
        color: "#b91c1c"
        open: false
        desc: "Normatividad general del Invierte.pe y marco legal de la inversión pública"
        children:
            - label: "Decreto Legislativo N° 1252 — Crea el Invierte.pe"
              type: law
              url: "https://www.mef.gob.pe/es/normatividad-inv-publica/instrumento/decretos-legislativos/15603-decreto-legislativo-n-1252/file"
            - label: "Decreto Supremo N° 284-2018-EF - Reglamento del Decreto Legislativo Nº 1252"
              type: law
              url: "https://www.mef.gob.pe/es/normatividad-inv-publica/temas/sistema-nacional-de-programacion-multianual-y-gestion-de-inversiones-invierte-pe/18648-decreto-supremo-n-284-2018-ef-2/file"
      - label: "Normatividad OXI"
        type: folder
        color: "#b91c1c"
        open: false
        desc: "Normatividad para la formulación mediante OXI"
        children:
            - label: "Decreto Supremo n.° 038-2026-EF"
              type: law
              url: "https://www.gob.pe/institucion/mef/normas-legales/7895406-038-2026-ef"
              desc: "Nuevo reglamento de la Ley N° 29230, Ley que impulsa la Inversión Pública Regional y Local con Participación del Sector Privado."
            - label: "Ley N° 29230"
              type: law
              url: "https://www.gob.pe/institucion/presidencia/normas-legales/425980-29230"
              desc: "Ley que impulsa la inversión pública regional y local con la participación del sector privado"
      - label: "Portal de Normatividad de la Inversión Pública del MEF"
        type: web
        url: "https://www.mef.gob.pe/es/normatividad-inv-publica/instrumento/decretos-legislativos"

- label: "Metodologías"
  type: folder
  color: "#ea580c"
  open: false
  desc: "Guías y lineamientos para la formulación y evaluación de inversiones"
  children:
      - label: "Generales"
        type: folder
        color: "#ea580c"
        open: false
        desc: "Metodologías y recursos generales para la formulación y evaluación de inversiones públicas"
        children:
            - label: "PIP - Guia general"
              type: pdf
              url: "https://www.mef.gob.pe/contenidos/inv_publica/docs/Metodologias_Generales_PI/GUIA_EX_ANTE_InviertePe.pdf"
              desc: "Guia general para la formulación y evaluación de proyectos de inversión pública"  
            - label: "IOARR - Lineamientos metodológicos"
              type: pdf
              url: "https://www.mef.gob.pe/contenidos/inv_publica/docs/Metodologias_Generales_PI/Lineamientos_IOARR.pdf"
              desc: "Lineamientos metodológicos para la formulación y evaluación de Inversiones con Resultados Asegurados (IOARR)"
            - label: "Anexo 11 - Parametros para la evaluación social"
              type: pdf
              url: "https://www.mef.gob.pe/contenidos/inv_publica/anexos/anexo11_directiva001_2019EF6301.pdf"
              desc: "Factores de conversión social, parámetros de evaluación social, entre otros parámetros para la evaluación social de proyectos de inversión pública"              
            - label: "Nota técnica para el uso de precios sociales"
              type: pdf
              url: "https://www.mef.gob.pe/contenidos/inv_publica/docs/Metodologias_Generales_PI/1_Nota_tecnica_uso_precios_sociales_2021.pdf"
              desc: "Nota técnica para el uso de precios sociales en la evaluación social de proyectos de inversión pública"
              
            - label: "Niveles y estándares de servicio"
              type: pdf
              url: "https://www.mef.gob.pe/es/metodologias/niveles-de-servicio-y-estandares-de-calidad"
              desc: "Nota técnica para el uso de precios sociales en la evaluación social de proyectos de inversión pública"              
      - label: "Educación"
        type: folder
        color: "#ea580c"
        open: false
        desc: "Metodologías y recursos para proyectos Educativos"
        children:
            - label: "OPMI Minedu"
              type: web
              url: "https://www.minedu.gob.pe/programacion-multianual-inversiones/"
              desc: "Ingresar en la 'Fase de Formulación y Evaluación', allí hallarás guías, fichas técnicas y otros recursos específicos para proyectos educativos"
      - label: "Seguridad Ciudadana"
