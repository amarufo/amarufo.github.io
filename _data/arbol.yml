# ============================================================
#  Árbol de recursos OFICIALES de Invierte.pe (MEF / Estado)
#  Solo normativa, metodologías, aplicativos del Estado, fichas
#  y anexos oficiales. NO incluye aplicaciones propias.
#  type:  folder | law | pdf | app | web | video | form | data
#  color: color identificador de la categoría (acento del nodo)
# ============================================================

- label: "Normatividad"
  type: folder
  color: "#dc2626"
  open: true
  desc: "Marco legal de la Programación Multianual y Gestión de Inversiones"
  children:
    - label: "Decreto Legislativo N° 1252 — Crea el Invierte.pe"
      type: law
      url: "https://www.mef.gob.pe/es/normatividad-sp-9867"
    - label: "Reglamento — D.S. N° 284-2018-EF"
      type: law
      url: "https://www.mef.gob.pe/es/normatividad-sp-9867"
    - label: "Directiva General del Invierte.pe"
      type: law
      url: "https://www.mef.gob.pe/es/normatividad-sp-9867"
    - label: "Portal de Normatividad del MEF"
      type: web
      url: "https://www.mef.gob.pe/es/normatividad-sp-9867"

- label: "Metodologías Generales"
  type: folder
  color: "#ea580c"
  open: true
